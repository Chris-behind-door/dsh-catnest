<?xml version="1.0" encoding="UTF-8"?>
<!-- 猫窝户型平面图（矢量）
     用途：前端存在感 UI / 文档配图。所有房间以 <g id="room-<id>"> 分组，
     坐标可直接 innerHTML 注入页面。房间几何关系与 home.json 的 adjacent 表一致：
     living 邻 entry/kitchen/balcony/study/bedroom；bedroom 邻 living/bath；bath 只邻 bedroom（最深）。
     角色位置可用 <circle> 叠加（见下方 kyu/moli 示例）。
     大地图 §2（2026-09-20）：右侧那一栏是小区「月见庭」的户外节点（unit_door/path/bench/
     garden/store/gate），与房间同属 home.rooms（outdoor:true）。玄关与单元门口之间那条虚线
     是全图唯一的「门边」：跨它才算出门/回家。屋内几何一个字没动，画布只往右加宽到 1140。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="720" viewBox="0 0 1140 720" font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
  <title>猫窝户型平面图</title>
  <desc>七个房间：玄关、客厅、厨房、阳台、书房、卧室、浴室。客厅为中心，浴室为最深私密位。</desc>

  <!-- 背景 -->
  <rect x="0" y="0" width="760" height="720" fill="#fdf6ec"/>
  <rect x="16" y="16" width="728" height="688" rx="18" fill="#faf0e0" stroke="#e3d3b8" stroke-width="2"/>
  <!-- 小区那一栏（月见庭）：和屋里同一张图，中间是那条唯一的门边 entry↔unit_door -->
  <rect x="740" y="16" width="384" height="688" rx="18" fill="#eef3ea" stroke="#c3d3bd" stroke-width="2"/>
  <text x="932" y="52" text-anchor="middle" font-size="19" font-weight="bold" fill="#4d6b45">月 见 庭</text>
  <text x="932" y="74" text-anchor="middle" font-size="11" fill="#7d9478">小区 · 黄昏的路灯是暖黄色的</text>

  <!-- 房间（底色 + 墙线 + 名称 + 功能） -->

  <!-- 玄关：仅供进出（仪式点），只邻客厅 -->
  <g id="room-entry" data-name="玄关">
    <rect x="250" y="40" width="140" height="130" fill="#efe3cc" stroke="#a58a63" stroke-width="3"/>
    <text x="320" y="92" text-anchor="middle" font-size="20" font-weight="bold" fill="#5d4a2f">玄 关</text>
    <text x="320" y="118" text-anchor="middle" font-size="12" fill="#8a6f4e">迎接 · 送别</text>
  </g>

  <!-- 客厅：全屋枢纽，五个出入口 -->
  <g id="room-living" data-name="客厅">
    <rect x="250" y="170" width="260" height="220" fill="#f6e7c8" stroke="#a58a63" stroke-width="3"/>
    <text x="380" y="262" text-anchor="middle" font-size="22" font-weight="bold" fill="#5d4a2f">客 厅</text>
    <text x="380" y="290" text-anchor="middle" font-size="12" fill="#8a6f4e">读书 · 聊天 · 游戏 · 看电视</text>
    <text x="380" y="330" text-anchor="middle" font-size="12" fill="#b09a76">◇ 全屋中心 ◇</text>
  </g>

  <!-- 厨房：邻客厅 -->
  <g id="room-kitchen" data-name="厨房">
    <rect x="40" y="170" width="210" height="220" fill="#fbe3cf" stroke="#a58a63" stroke-width="3"/>
    <text x="145" y="262" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b4a2f">厨 房</text>
    <text x="145" y="290" text-anchor="middle" font-size="12" fill="#96693f">做饭 · 吃东西 · 投喂</text>
  </g>

  <!-- 阳台：邻客厅 -->
  <g id="room-balcony" data-name="阳台">
    <rect x="510" y="170" width="210" height="220" fill="#e6efd9" stroke="#a58a63" stroke-width="3"/>
    <text x="615" y="262" text-anchor="middle" font-size="18" font-weight="bold" fill="#4d5f33">阳 台</text>
    <text x="615" y="290" text-anchor="middle" font-size="12" fill="#74824e">晒太阳 · 看风景 · 晾衣服</text>
  </g>

  <!-- 卧室：邻客厅与浴室 -->
  <g id="room-bedroom" data-name="卧室">
    <rect x="250" y="390" width="200" height="140" fill="#f6dde3" stroke="#a58a63" stroke-width="3"/>
    <text x="350" y="446" text-anchor="middle" font-size="18" font-weight="bold" fill="#7a3f4f">卧 室</text>
    <text x="350" y="472" text-anchor="middle" font-size="12" fill="#a05a6d">睡觉 · 贴贴</text>
  </g>

  <!-- 书房：邻客厅 -->
  <g id="room-study" data-name="书房">
    <rect x="450" y="390" width="130" height="140" fill="#dde6f2" stroke="#a58a63" stroke-width="3"/>
    <text x="515" y="446" text-anchor="middle" font-size="18" font-weight="bold" fill="#3f5277">书 房</text>
    <text x="515" y="472" text-anchor="middle" font-size="12" fill="#5e7399">安静看书 · 发呆</text>
  </g>

  <!-- 浴室：全屋最深，只邻卧室（私密位，外面客厅听不到） -->
  <g id="room-bath" data-name="浴室">
    <rect x="250" y="530" width="200" height="130" fill="#d8ebf0" stroke="#a58a63" stroke-width="3"/>
    <text x="350" y="582" text-anchor="middle" font-size="18" font-weight="bold" fill="#33576b">浴 室</text>
    <text x="350" y="608" text-anchor="middle" font-size="12" fill="#5a7f93">洗漱 · 泡澡 · 私密</text>
    <text x="350" y="636" text-anchor="middle" font-size="11" fill="#7fa0b0">▲ 最深处 · 只邻卧室 ▲</text>
  </g>

  <!-- 门洞：共享墙上的开口 -->

  <!-- 玄关 → 客厅 -->
  <g id="door-entry-living">
    <rect x="287" y="164" width="46" height="12" fill="#faf0e0"/>
    <path d="M287 176 q23 26 46 0" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>
  <!-- 厨房 → 客厅 -->
  <g id="door-kitchen-living">
    <rect x="244" y="262" width="12" height="46" fill="#faf0e0"/>
    <path d="M256 262 q26 23 0 46" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>
  <!-- 阳台 → 客厅 -->
  <g id="door-balcony-living">
    <rect x="504" y="262" width="12" height="46" fill="#faf0e0"/>
    <path d="M504 262 q-26 23 0 46" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>
  <!-- 书房 → 客厅 -->
  <g id="door-study-living">
    <rect x="492" y="384" width="46" height="12" fill="#faf0e0"/>
    <path d="M492 396 q-23 26 0 52" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>
  <!-- 卧室 → 客厅 -->
  <g id="door-bedroom-living">
    <rect x="327" y="384" width="46" height="12" fill="#faf0e0"/>
    <path d="M327 396 q23 26 46 0" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>
  <!-- 浴室 → 卧室 -->
  <g id="door-bath-bedroom">
    <rect x="327" y="524" width="46" height="12" fill="#faf0e0"/>
    <path d="M327 536 q23 26 46 0" fill="none" stroke="#a58a63" stroke-width="2"/>
  </g>

  <!-- ── 小区「月见庭」（大地图 §2）：户外节点，与房间同图 ── -->

  <!-- 门边（全图唯一）：玄关 → 单元门口。跨这条边才算出门 / 回家 -->
  <g id="door-entry-unit_door">
    <path d="M394 150 H 770" fill="none" stroke="#a58a63" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="404" y="141" width="18" height="18" rx="3" fill="#faf0e0" stroke="#a58a63" stroke-width="2"/>
    <text x="560" y="138" text-anchor="middle" font-size="11" fill="#a58a63">门边（出家门 / 回家）</text>
  </g>

  <!-- 单元门口的连线（步道 → 长椅 / 小花园 / 便利店，便利店 → 小区大门） -->
  <g id="yard-edges" fill="none" stroke="#b9c9b2" stroke-width="2.5">
    <path d="M910 216 V 252"/>
    <path d="M900 296 H 783 V 368"/>
    <path d="M900 296 H 1060 V 368"/>
    <path d="M960 296 V 440 H 800 V 468"/>
    <path d="M960 296 V 440 H 1090 V 468"/>
  </g>

  <!-- 单元门口：门内是玄关，门外就是小区了 -->
  <g id="room-unit_door" data-name="单元门口">
    <rect x="790" y="124" width="240" height="92" rx="12" fill="#e7ecdf" stroke="#8fa884" stroke-width="3"/>
    <text x="910" y="162" text-anchor="middle" font-size="17" font-weight="bold" fill="#43583a">单元门口</text>
    <text x="910" y="186" text-anchor="middle" font-size="11" fill="#718a68">玻璃上贴着褪色的通知</text>
  </g>

  <!-- 步道·路灯（验收②：有路灯） -->
  <g id="room-path" data-name="步道">
    <rect x="800" y="252" width="200" height="88" rx="12" fill="#eef1e0" stroke="#8fa884" stroke-width="3"/>
    <text x="900" y="288" text-anchor="middle" font-size="17" font-weight="bold" fill="#43583a">步道 · 路灯</text>
    <text x="900" y="312" text-anchor="middle" font-size="11" fill="#718a68">暖黄路灯 · 风里有桂花味</text>
    <circle cx="815" cy="268" r="5" fill="#f6d98a" stroke="#c9a94e" stroke-width="1.5"/>
    <circle cx="985" cy="268" r="5" fill="#f6d98a" stroke="#c9a94e" stroke-width="1.5"/>
  </g>

  <!-- 长椅（验收③：有长椅） -->
  <g id="room-bench" data-name="长椅">
    <rect x="1060" y="372" width="60" height="100" rx="10" fill="#f3ebdc" stroke="#8fa884" stroke-width="3"/>
    <text x="1090" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#43583a">长椅</text>
    <text x="1090" y="440" text-anchor="middle" font-size="10" fill="#718a68">坐得温润</text>
  </g>

  <!-- 小花园 -->
  <g id="room-garden" data-name="小花园">
    <rect x="753" y="372" width="94" height="100" rx="10" fill="#e8f0e0" stroke="#8fa884" stroke-width="3"/>
    <text x="800" y="412" text-anchor="middle" font-size="14" font-weight="bold" fill="#43583a">小花园</text>
    <text x="800" y="432" text-anchor="middle" font-size="10" fill="#718a68">月见草</text>
    <text x="800" y="446" text-anchor="middle" font-size="10" fill="#718a68">开成一片白</text>
  </g>

  <!-- 便利店 · 快递柜 -->
  <g id="room-store" data-name="便利店">
    <rect x="800" y="472" width="60" height="100" rx="10" fill="#eef0e8" stroke="#8fa884" stroke-width="3"/>
    <text x="830" y="520" text-anchor="middle" font-size="13" font-weight="bold" fill="#43583a">便利</text>
    <text x="830" y="538" text-anchor="middle" font-size="13" font-weight="bold" fill="#43583a">店</text>
    <text x="830" y="556" text-anchor="middle" font-size="10" fill="#718a68">快递柜</text>
  </g>

  <!-- 小区大门：世界到此为止（设计 §2：周边留接口不实现） -->
  <g id="room-gate" data-name="小区大门">
    <rect x="1060" y="472" width="60" height="100" rx="10" fill="#ece6d8" stroke="#8fa884" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="1090" y="514" text-anchor="middle" font-size="13" font-weight="bold" fill="#43583a">小区</text>
    <text x="1090" y="532" text-anchor="middle" font-size="13" font-weight="bold" fill="#43583a">大门</text>
    <text x="1090" y="552" text-anchor="middle" font-size="10" fill="#718a68">路没通</text>
  </g>

  <!-- 角色坐标（当前站位示例：小玖、墨璃在客厅；主人外出）
       前端可从 ctx.catnest.scene / home 读实时位置后移动这些圆点 -->
  <g id="inhabitants" fill="#000" opacity="0.92">
    <!-- 小玖：白毛浅绿瞳 → 白圆 + 绿边，带呆毛 -->
    <circle cx="330" cy="216" r="11" fill="#fffdf7" stroke="#7fae7f" stroke-width="2.5"/>
    <path d="M330 205 l-3 -8 M330 205 l3 -8" stroke="#7fae7f" stroke-width="2" fill="none"/>
    <text x="330" y="200" text-anchor="middle" font-size="12" fill="#5d4a2f">小玖</text>
    <!-- 墨璃：黑毛红瞳 → 深圆 + 红边 -->
    <circle cx="430" cy="216" r="11" fill="#3a3540" stroke="#b05060" stroke-width="2.5"/>
    <text x="430" y="200" text-anchor="middle" font-size="12" fill="#5d4a2f">墨璃</text>
    <!-- 主人：外出（不在家不落位） -->
    <text x="380" y="360" text-anchor="middle" font-size="12" fill="#b09a76">主人：外出中</text>
  </g>

  <!-- 图例 -->
  <g id="legend" font-size="11" fill="#8a6f4e">
    <rect x="40" y="690" width="16" height="16" rx="3" fill="#f6e7c8" stroke="#a58a63"/>
    <text x="66" y="702">客厅（枢纽）</text>
    <rect x="180" y="690" width="16" height="16" rx="3" fill="#d8ebf0" stroke="#a58a63"/>
    <text x="206" y="702">浴室（私密）</text>
    <circle cx="306" cy="698" r="6" fill="#fffdf7" stroke="#7fae7f" stroke-width="2"/>
    <text x="320" y="702">小玖</text>
    <circle cx="362" cy="698" r="6" fill="#3a3540" stroke="#b05060" stroke-width="2"/>
    <text x="376" y="702">墨璃</text>
  </g>
</svg>